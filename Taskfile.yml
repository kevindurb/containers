---
version: 3

vars:
  ARCH: amd64

tasks:
  default: task --list-all

  build:
    internal: true
    requires:
      vars: [FILE, ARCH, TAG]
    cmd: >
      podman build
      --platform linux/{{.ARCH}}
      -t {{.TAG}}
      -f {{.FILE}}
      .

  build:*:
    vars:
      CONTAINER: '{{index .MATCH 0}}'
    cmd:
      task: build
      vars:
        FILE: ./containers/{{.CONTAINER}}/Containerfile
        TAG: '{{.CONTAINER}}:local'
